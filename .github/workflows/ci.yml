name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks on the tagged commit first.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes the run before it; runs on main
# and on tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Make a ReFS volume, and a volume without a drive letter
        # ReFS, which a Dev Drive uses, does not keep a file's 64-bit index
        # unique, so file identity is tested on it too: TestInspect_OnReFS
        # finds the volume through LOADLINE_TEST_REFS_DIR, and fails unless
        # that names a folder there, which this step makes. The disk is
        # expandable, so it takes only what is written to it, though ReFS
        # needs a few gigabytes to format.
        #
        # The second disk, a small NTFS one, gets no drive letter, as some
        # RAM disks, container mounts and network redirectors get none; one
        # that Windows gives it on its own is taken away again.
        # TestSecure_RefusesADataDirectoryOnAVolumeWithoutADriveLetter finds
        # it through LOADLINE_TEST_NOLETTER_DIR, a folder there reached by the
        # volume's GUID name, and fails unless that names a folder on a volume
        # without a drive letter, which this step makes.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'refs.vhdx'
          $noLetterVhd = Join-Path $env:RUNNER_TEMP 'noletter.vhdx'
          $noLetterLabel = 'loadline-noletter'
          $script = Join-Path $env:RUNNER_TEMP 'refs.diskpart'
          $testDir = 'R:\loadline-test'
          Set-Content -LiteralPath $script -Encoding ascii -Value @(
            "create vdisk file=`"$vhd`" maximum=8192 type=expandable"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            'format fs=refs quick'
            'assign letter=R'
            "create vdisk file=`"$noLetterVhd`" maximum=64 type=expandable"
            "select vdisk file=`"$noLetterVhd`""
            'attach vdisk'
            'create partition primary'
            "format fs=ntfs label=$noLetterLabel quick"
            'remove all noerr'
          )
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart exited with $LASTEXITCODE" }
          $fileSystem = (Get-Volume -DriveLetter R).FileSystem
          if ($fileSystem -ne 'ReFS') { throw "R: is $fileSystem, not ReFS" }
          New-Item -ItemType Directory -Path $testDir | Out-Null
          "LOADLINE_TEST_REFS_DIR=$testDir" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $noLetter = Get-Volume -FileSystemLabel $noLetterLabel
          if ($noLetter.DriveLetter) { throw "$noLetterLabel has the drive letter $($noLetter.DriveLetter)" }
          # Path is the volume's GUID name, \\?\Volume{…}\, whose ? PowerShell's
          # own path cmdlets would read as a wildcard.
          $noLetterDir = $noLetter.Path + 'loadline-test'
          [IO.Directory]::CreateDirectory($noLetterDir) | Out-Null
          "LOADLINE_TEST_NOLETTER_DIR=$noLetterDir" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test
        # The race detector needs cgo, so a runner without a C compiler fails
        # here rather than testing without it. GitHub sets CI=true, which also
        # runs the Windows test that binds a wildcard address, skipped on
        # developer machines for the firewall prompt it raises.
        env:
          CGO_ENABLED: "1"
        run: go test -race -timeout 20m ./...
      - name: Test file identity and a token's names on ReFS
        # TestInspect_OnReFS reads IDs in LOADLINE_TEST_REFS_DIR. The token
        # test makes its data directory and every other name it gives the
        # token with t.TempDir(), which follows TMP, so the guard first proves
        # the temporary folder is on the ReFS volume, where two files can share
        # a 64-bit index. The log lists each test and case as run, so none of
        # them passed by being skipped.
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          TMP: ${{ env.LOADLINE_TEST_REFS_DIR }}
          TEMP: ${{ env.LOADLINE_TEST_REFS_DIR }}
        run: |
          $temp = [IO.Path]::GetTempPath()
          if (-not $temp.StartsWith('R:\', [StringComparison]::OrdinalIgnoreCase)) {
            throw "the temporary folder is $temp, not on the ReFS volume R:"
          }
          go test -race -count=1 -v -run 'TestInspect_OnReFS$|TestMake_StillRefusesAnotherNameBesideTheTokensTemporaryOne$' ./internal/fsperm/ ./internal/datadir/
      - name: Test the refusal of a data directory on a volume without a drive letter
        # The test makes its data directory in LOADLINE_TEST_NOLETTER_DIR. The
        # log lists it as run, so it did not pass by being skipped.
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -v -run 'TestSecure_RefusesADataDirectoryOnAVolumeWithoutADriveLetter$' ./internal/datadir/
      - name: Test the refusal of a data directory a cloud service syncs
        # These tests register a sync root of their own, as a cloud service
        # registers the folder it keeps in sync, and skip, naming the HRESULT,
        # where Windows refuses to. The log lists each test as run or skipped,
        # so it says whether the refusal was seen against a sync root Windows
        # answers for, or only through a stand-in.
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -v -run 'TestSyncRoot_|InsideASyncRoot$|IntoASyncRoot$' ./internal/fsperm/ ./internal/datadir/
      - name: Make a second local account
        # The TestIntegration_ tests give a data directory to this account.
        # It has no password, so the log holds nothing secret. The runner is
        # an administrator, whose SeRestorePrivilege lets the tests give a
        # folder to another account, and back again. The tests need only its
        # SID, so it is disabled: nobody can sign in to it. Windows PowerShell
        # has the LocalAccounts cmdlets built in, which some builds of
        # PowerShell 7 fail to load.
        id: second-account
        if: runner.os == 'Windows'
        shell: powershell
        run: New-LocalUser -Name loadline-it -NoPassword -Disabled
      - name: Make a folder another account owns
        # The TestIntegration_ test on Linux and macOS takes this folder as its
        # data directory. Its config names a port the system has just given
        # out, so that doctor asks no server that may listen on the default
        # one. The runner, which owns neither the folder nor its config, could
        # not clear them out of RUNNER_TEMP, so a step below removes them.
        id: foreign-folder
        if: runner.os != 'Windows'
        run: |
          dir="$RUNNER_TEMP/loadline-it"
          sudo install -d -o nobody -m 0755 "$dir"
          port=$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')
          printf '{"port":%s}\n' "$port" | sudo tee "$dir/config.json" > /dev/null
          sudo chown nobody "$dir/config.json"
          sudo chmod 0644 "$dir/config.json"
      - name: Test the refusal of a data directory another account owns
        # Each test skips unless its variable is set, and fails when what that
        # names cannot be used. The log lists each test as run, so none of
        # them passed by being skipped.
        env:
          CGO_ENABLED: "1"
          LOADLINE_IT_OTHER_ACCOUNT: loadline-it
          LOADLINE_IT_FOREIGN_DIR: ${{ runner.temp }}/loadline-it
        run: go test -race -count=1 -v -run TestIntegration_ ./internal/cli/
      - name: Remove the second local account
        # Whatever came of the tests, once the step that makes it has run.
        if: always() && steps.second-account.outcome != 'skipped'
        shell: powershell
        run: Remove-LocalUser -Name loadline-it
      - name: Remove the folder another account owns
        # Whatever came of the tests, once the step that makes it has run.
        if: always() && runner.os != 'Windows' && steps.foreign-folder.outcome != 'skipped'
        run: sudo rm -rf "$RUNNER_TEMP/loadline-it"
      - name: Test the full generated cases and the real tap under every shell
        # Under the race detector these tests run a reduced set of cases, or
        # one shell, to stay inside CI time; without it they run every case
        # under every shell.
        run: go test -timeout 10m -run 'TestBashForm_KeepsTheOriginalsMeaning|TestBashForm_RealTapBeforeOriginalsThatNeverRead|TestReadHookInput_' ./internal/install/ ./internal/protocol/
      - name: Test the linear costs at a larger scale, and the views' allocation budgets
        # Under the race detector these tests hold the credit estimate and the
        # tracker's views to a cost that grows linearly at a small scale, to
        # stay inside CI time; without it they check the same at a larger one.
        # The views' allocation budgets are checked only here: under the race
        # detector, which slows a view several times over, they are skipped.
        run: go test -count=1 -timeout 10m -run 'TestEstimateCredits_OnePassOverManySpansAndCalls$|TestTracker_ADayOfAnIdleSessionsReadingsKeepsViewsCheap$|TestTracker_AViewTakesOnePassOverTheSpansAndCalls$|TestTracker_ADayViewAllocatesWithinItsBudget$|TestTracker_AMonthViewAllocatesWithinItsBudget$' ./internal/domain/ ./internal/tracker/
      - name: Report the hot-path and view benchmarks
        # The figures are for reading, such as the tap's echo-ms/op against
        # the spec's 30 ms p95 budget. No benchmark asserts a time, and the
        # tests above cover the code they run, so the step reports and does
        # not decide the build. At 3x, a p95 is the worst of three runs.
        continue-on-error: true
        run: go test -run '^$' -bench . -benchtime 3x ./internal/cli/ ./internal/tracker/ ./internal/domain/

  lint:
    name: lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Each platform's build has files of its own, such as *_windows.go.
        goos:
          - linux
          - windows
          - darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        with:
          version: v2.15.0
          # The jobs share one cache key; one of them saving it is enough.
          skip-save-cache: ${{ matrix.goos != 'linux' }}

  vuln:
    name: vuln (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos:
          - linux
          - windows
          - darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # Installed for the runner first: govulncheck itself must not be built
      # for the platform it scans.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      # The build the releases ship: static, without cgo.
      - name: Scan
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: govulncheck ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check that the committed bundle is current
        working-directory: .
        run: |
          git diff --exit-code -- internal/web/dist
          untracked=$(git ls-files --others --exclude-standard -- internal/web/dist)
          if [ -n "$untracked" ]; then
            printf 'Not committed:\n%s\n' "$untracked"
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the binary
        run: make build
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: web
        env:
          LOADLINE_BIN: ${{ github.workspace }}/bin/loadline
        run: npm run e2e
      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces
          path: web/test-results/
          retention-days: 7
