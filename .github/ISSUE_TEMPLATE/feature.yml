name: Feature request
description: Suggest something Loadline could do, or do better.
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Loadline is a local, read-only view of your Claude Code sessions: it shows what Claude Code reports and never routes, proxies or changes your traffic. Ideas that fit that are the easiest to take on.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How Loadline could help. A sketch of the dashboard or a command line is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways around it, including outside Loadline.

  - type: dropdown
    id: os
    attributes:
      label: Where you would use it
      multiple: true
      options:
        - Windows
        - macOS
        - Linux

  - type: checkboxes
    id: searched
    attributes:
      label: Before you post
      options:
        - label: I searched the open and closed issues for this idea.
          required: true
