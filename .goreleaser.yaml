# Release builds: run by .github/workflows/release.yml for a v* tag. Check a
# change locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: loadline

builds:
  - id: loadline
    main: ./cmd/loadline
    binary: loadline
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/dsj7419/loadline/internal/cli.Version={{.Version}}
    # The same commit always builds the same binary.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: loadline
    ids:
      - loadline
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Each file is archived with the same owner, mode and time wherever and
    # whenever it was checked out, so the same commit always builds the same
    # archives, and checksums.txt with them.
    files:
      - src: LICENSE
        info: &docinfo { owner: root, group: root, mode: 0644, mtime: "{{ .CommitDate }}" }
      - { src: README.md, info: *docinfo }
      - { src: CHANGELOG.md, info: *docinfo }
      - { src: THIRD_PARTY_NOTICES.md, info: *docinfo }

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# CHANGELOG.md is the record of what changed; the release page links to it.
changelog:
  disable: true

release:
  # The release workflow publishes it once the archives are attested. A rerun
  # replaces the draft a failed run left behind.
  draft: true
  replace_existing_draft: true
  prerelease: auto
  header: |
    See [CHANGELOG.md](https://github.com/dsj7419/loadline/blob/{{ .Tag }}/CHANGELOG.md) for what changed.

    Every archive and `checksums.txt` carries a build provenance attestation. To check one after downloading it:

    ```
    gh attestation verify <archive> --repo dsj7419/loadline
    ```
